                <script> 

                    function getValue() {
                        // 1. Select the input element using its ID.
                        const inputField = document.getElementById("myInput");

                        // 2. Get the current value (string) from the input field using the .value property.
                        const inputValue = inputField.value;

                        // Empty vector
                        const asciiValues = [];

                        for (let i = 0; i < inputValue.length; i++) {
                            const ascii = inputValue.charCodeAt(i)-1;
                            asciiValues.push(ascii);
                            // console.log(`Character: ${inputValue[i]}, ASCII Value: ${ascii}`);
                        }

                        setMatrix(asciiValues)

                        // You can also log the value to the console
                        // console.log("Retrieved string:", inputValue);
                    }

                    function setMatrix(asciiValues) {
                        document.getElementById("output").textContent = asciiValues;
                        
                        const out = [];

                        for (let i = 0; i < 7; i++) {

                            dum = asciiValues[i] - 32;
                            out.push(asciiValues[i] + 1)
                            // Set 0 @ ! so that strings can be split at spaces = 32

                            for (let j = 0; j < 7; j++) {
                                // document.getElementById(`M${i}${j}`).value = asciiValues[i];
                                button = document.getElementById(`M${i}${j}`)
                                button.value = ((dum>>j) & 0X01) ? 1 : 0;
                                button.style.backgroundColor = ((dum>>j) & 0X01) ? 'blue' : '#F54927';
                            }
                        }

                        disp_unicode_NEW(out);

                        // disp_unicode(asciiValues[0]+1,asciiValues[1]+1,asciiValues[2]+1,asciiValues[3]+1,asciiValues[4]+1,asciiValues[5]+1,asciiValues[6]+1);
                    }

                    // Execute a function when the user presses a key on the keyboard
                    document.getElementById("myInput").addEventListener("keydown", 
                    function(event) {
                      // Check if the user presses the "Enter" key
                      if (event.key == "Enter") {
                        // Prevent the default form submission behavior (if any)
                        event.preventDefault();
                        // Call your function or trigger a button click
                        document.getElementById("submit").click();
                      }
                    });

                    // Function to change color
                    function toggleColor(val) {
                        const button = document.getElementById(val)
                        if (button.value == '0') {
                            button.style.backgroundColor = 'blue';
                            button.value = '1';
                        }
                        else {
                            button.style.backgroundColor = '#F54927';
                            button.value = '0';
                        }

                        const rowNums = [];
                        for (let i = 0; i < 7; i++) {
                            let d = '0b'
                            for (let j = 0; j < 7; j++) {
                                d += document.getElementById(`M${i}${6-j}`).value
                            }
                            rowNums.push(math.evaluate(d)+33);

                            // console.log(`Character: ${d}`);
                        }

                        disp_unicode_NEW(rowNums);

                        // let d0 = '0b' + document.getElementById("M06").value + document.getElementById("M05").value + document.getElementById("M04").value + document.getElementById("M03").value + document.getElementById("M02").value + document.getElementById("M01").value + document.getElementById("M00").value
                        // let d1 = '0b' + document.getElementById("M16").value + document.getElementById("M15").value + document.getElementById("M14").value + document.getElementById("M13").value + document.getElementById("M12").value + document.getElementById("M11").value + document.getElementById("M10").value
                        // let d2 = '0b' + document.getElementById("M26").value + document.getElementById("M25").value + document.getElementById("M24").value + document.getElementById("M23").value + document.getElementById("M22").value + document.getElementById("M21").value + document.getElementById("M20").value
                        // let d3 = '0b' + document.getElementById("M36").value + document.getElementById("M35").value + document.getElementById("M34").value + document.getElementById("M33").value + document.getElementById("M32").value + document.getElementById("M31").value + document.getElementById("M30").value
                        // let d4 = '0b' + document.getElementById("M46").value + document.getElementById("M45").value + document.getElementById("M44").value + document.getElementById("M43").value + document.getElementById("M42").value + document.getElementById("M41").value + document.getElementById("M40").value
                        // let d5 = '0b' + document.getElementById("M56").value + document.getElementById("M55").value + document.getElementById("M54").value + document.getElementById("M53").value + document.getElementById("M52").value + document.getElementById("M51").value + document.getElementById("M50").value
                        // let d6 = '0b' + document.getElementById("M66").value + document.getElementById("M65").value + document.getElementById("M64").value + document.getElementById("M63").value + document.getElementById("M62").value + document.getElementById("M61").value + document.getElementById("M60").value
                        // // document.getElementById("result").value = math.evaluate(d0) + 33
                        // disp_unicode(math.evaluate(d0)+33,math.evaluate(d1)+33,math.evaluate(d2)+33,math.evaluate(d3)+33,math.evaluate(d4)+33,math.evaluate(d5)+33,math.evaluate(d6)+33)
                    }

                    function disp_unicode(v1,v2,v3,v4,v5,v6,v7) {
                        document.getElementById("sprite-creator").innerHTML = `&#${v1}&#${v2}&#${v3}&#${v4}&#${v5}&#${v6}&#${v7};` ;
                        outtext = document.getElementById("output");
                        outtext.textContent = `${v1},${v2},${v3},${v4},${v5},${v6},${v7}`;

                        document.getElementById("myInput").value = document.getElementById("sprite-creator").innerHTML;
                    }

                    function disp_unicode_NEW(v) {
                        document.getElementById("sprite-creator").innerHTML = `&#${v[0]}&#${v[1]}&#${v[2]}&#${v[3]}&#${v[4]}&#${v[5]}&#${v[6]};` ;
                        document.getElementById("output").textContent = `${v[0]},${v[1]},${v[2]},${v[3]},${v[4]},${v[5]},${v[6]}`;
                        document.getElementById("myInput").value = document.getElementById("sprite-creator").innerHTML;
